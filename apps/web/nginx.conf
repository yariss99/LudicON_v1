# Static hosting for the built SPA.
#
# Mounted at /etc/nginx/conf.d/default.conf, replacing the image's stock server
# block. Deliberately small: this serves files and nothing else — no proxying,
# no rewriting beyond the history fallback.
#
# Listens on 5173 rather than 80 so the container port is the same in the dev
# (Vite) and runtime (nginx) targets, and so the compose port mapping does not
# have to change between them.
#
# nginx `add_header` gotcha: directives are inherited from an outer block only
# if the inner block declares none of its own. Locations that set their own
# caching headers therefore repeat the security headers.

server {
    listen      5173;
    listen      [::]:5173;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Uncompressed responses over a slow link are the biggest cost here.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Vite writes content-hashed filenames into /assets, so a cached asset can
    # never be stale — a changed file is a different URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control          "public, immutable"             always;
        add_header X-Content-Type-Options "nosniff"                       always;
        add_header X-Frame-Options        "SAMEORIGIN"                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The entry document is not hashed and must never be cached, or a deploy
    # will keep serving links to assets that no longer exist.
    location = /index.html {
        add_header Cache-Control          "no-cache"                      always;
        add_header X-Content-Type-Options "nosniff"                       always;
        add_header X-Frame-Options        "SAMEORIGIN"                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # History fallback: any path the router owns resolves to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
